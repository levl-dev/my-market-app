spring.r2dbc.url=r2dbc:postgresql://localhost:5432/market_app
spring.r2dbc.username=market_app_user
spring.r2dbc.password=123456

spring.sql.init.mode=always

spring.thymeleaf.cache=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

app.items.cache.ttl=PT2M
payment.base-url=http://localhost:8081

spring.security.oauth2.client.registration.payment-service.provider=keycloak
spring.security.oauth2.client.registration.payment-service.client-id=store-app
spring.security.oauth2.client.registration.payment-service.client-secret=MY_KEYCLOAK_CLIENT_SECRET
spring.security.oauth2.client.registration.payment-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8180/realms/my-market/protocol/openid-connect/token